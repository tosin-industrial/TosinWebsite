<div class="tsn-mat">
  <style>
    .tsn-mat {
      /* === 配色（呼應 Blocksy 主題） === */
      --tsn-c-primary: #2872fa;
      --tsn-c-primary-dark: #1559ed;
      --tsn-c-dark: #192a3d;
      --tsn-c-slate: #3A4F66;
      --tsn-c-border: #e1e8ed;
      --tsn-c-bg-alt: #f2f5f7;
      --tsn-c-bg: #ffffff;
      --tsn-c-text: #192a3d;
      --tsn-c-muted: #6b7c8e;
      /* 評級 A~E（Excel 條件格式風：整格極淡填色，A 綠 → E 紅） */
      --tsn-r-a: #d4e6c8;
      --tsn-r-b: #e6e6c5;
      --tsn-r-c: #f5dfb0;
      --tsn-r-d: #ecc9b5;
      --tsn-r-e: #dcb0aa;
      /* 間距 / 字級 */
      --tsn-radius: 6px;
      --tsn-font: 'Noto Sans', 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', system-ui, sans-serif;
      font-family: var(--tsn-font);
      color: var(--tsn-c-text);
      line-height: 1.5;
      box-sizing: border-box;
    }
    .tsn-mat *, .tsn-mat *::before, .tsn-mat *::after { box-sizing: border-box; }

    /* === 篩選器列 + 重置按鈕同列 === */
    .tsn-mat__filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .tsn-mat__filter-bar .tsn-mat__filters {
      flex: 1 1 auto;
      margin-bottom: 0;
    }
    .tsn-mat__filter-bar .tsn-mat__reset {
      margin-left: auto;
      flex-shrink: 0;
    }
    .tsn-mat__reset {
      appearance: none;
      border: 1px solid var(--tsn-c-border);
      background: var(--tsn-c-bg);
      color: var(--tsn-c-slate);
      font: inherit;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: var(--tsn-radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tsn-mat__reset:hover {
      border-color: var(--tsn-c-primary);
      color: var(--tsn-c-primary);
    }
    .tsn-mat__reset::before {
      content: "↻";
      font-size: 15px;
      line-height: 1;
    }

    /* === 每張表的區塊 === */
    .tsn-mat__section { margin-bottom: 48px; }
    .tsn-mat__title {
      font-size: 22px;
      font-weight: 700;
      color: var(--tsn-c-dark);
      margin: 0 0 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--tsn-c-dark);
    }

    /* === 篩選器列 === */
    .tsn-mat__filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .tsn-mat__filter { position: relative; }
    .tsn-mat__filter-btn {
      appearance: none;
      border: 1px solid var(--tsn-c-border);
      background: var(--tsn-c-bg);
      color: var(--tsn-c-text);
      font: inherit;
      font-size: 14px;
      padding: 8px 32px 8px 14px;
      border-radius: var(--tsn-radius);
      cursor: pointer;
      min-width: 160px;
      text-align: left;
      position: relative;
      transition: border-color 0.15s;
    }
    .tsn-mat__filter-btn::after {
      content: "";
      position: absolute;
      right: 12px; top: 50%;
      width: 8px; height: 8px;
      border-right: 2px solid var(--tsn-c-muted);
      border-bottom: 2px solid var(--tsn-c-muted);
      transform: translateY(-70%) rotate(45deg);
      transition: transform 0.15s;
    }
    .tsn-mat__filter.is-open .tsn-mat__filter-btn::after {
      transform: translateY(-20%) rotate(-135deg);
    }
    .tsn-mat__filter-btn:hover { border-color: var(--tsn-c-primary); }
    .tsn-mat__filter-btn .tsn-mat__filter-count {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 10px;
      background: var(--tsn-c-primary);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }
    .tsn-mat__filter-panel {
      display: none;
      position: absolute;
      top: calc(100% + 4px); left: 0;
      z-index: 20;
      min-width: 240px;
      max-width: 320px;
      max-height: 340px;
      overflow-y: auto;
      background: var(--tsn-c-bg);
      border: 1px solid var(--tsn-c-border);
      border-radius: var(--tsn-radius);
      box-shadow: 0 10px 30px rgba(25, 42, 61, 0.12);
      padding: 6px 0;
    }
    .tsn-mat__filter.is-open .tsn-mat__filter-panel { display: block; }
    .tsn-mat__filter-actions {
      display: flex;
      gap: 6px;
      padding: 6px 12px 8px;
      border-bottom: 1px solid var(--tsn-c-border);
      margin-bottom: 4px;
    }
    .tsn-mat__filter-action {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--tsn-c-primary);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .tsn-mat__filter-action:hover { text-decoration: underline; }
    .tsn-mat__filter-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 14px;
      user-select: none;
    }
    .tsn-mat__filter-opt:hover { background: var(--tsn-c-bg-alt); }
    .tsn-mat__filter-opt input { accent-color: var(--tsn-c-primary); margin: 0; }

    /* === 評級說明 === */
    .tsn-mat__legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      font-size: 13px;
      color: var(--tsn-c-muted);
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--tsn-c-bg-alt);
      border-radius: var(--tsn-radius);
    }
    .tsn-mat__legend-item { display: inline-flex; align-items: center; gap: 6px; }
    /* 評級 pill 共用樣式（圖例用 inline、表格內用 --cell 變體填滿整格） */
    .tsn-mat__rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px; height: 22px;
      padding: 0 6px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
      color: var(--tsn-c-text);
    }
    .tsn-mat__rank--A { background: var(--tsn-r-a); }
    .tsn-mat__rank--B { background: var(--tsn-r-b); }
    .tsn-mat__rank--C { background: var(--tsn-r-c); }
    .tsn-mat__rank--D { background: var(--tsn-r-d); }
    .tsn-mat__rank--E { background: var(--tsn-r-e); }
    /* 表格內：填滿整個儲存格（用負 margin 抵消 td 的 padding） */
    .tsn-mat__rank--cell {
      display: block;
      margin: -10px -12px;
      padding: 10px 12px;
      border-radius: 0;
      min-width: 0; height: auto;
      text-align: center;
    }

    /* === 表格 === */
    .tsn-mat__table-wrap {
      overflow-x: auto;
      border: 1px solid var(--tsn-c-border);
      border-radius: var(--tsn-radius);
      -webkit-overflow-scrolling: touch;
    }
    .tsn-mat__table {
      width: 100%;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: var(--tsn-c-bg);
    }
    .tsn-mat__table th,
    .tsn-mat__table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--tsn-c-border);
      vertical-align: middle;
      white-space: nowrap;
    }
    .tsn-mat__table th {
      background: var(--tsn-c-dark);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .tsn-mat__table tbody tr:nth-child(even) td { background: var(--tsn-c-bg-alt); }
    .tsn-mat__table tbody tr:hover td { background: #e9eff5; }
    .tsn-mat__table .is-numeric { text-align: right; font-variant-numeric: tabular-nums; }
    .tsn-mat__table .is-center { text-align: center; }
    /* 「實驗數值」欄位（EPDM 60 / 70）底色帶藍，與描述欄位區隔；保留斑馬紋層次 */
    .tsn-mat__table tbody tr td.tsn-mat__td--value { background: #eaf2ff; }
    .tsn-mat__table tbody tr:nth-child(even) td.tsn-mat__td--value { background: #d9e6f5; }
    .tsn-mat__table tbody tr:hover td.tsn-mat__td--value { background: #c9dcef; }
    .tsn-mat__empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--tsn-c-muted);
      font-size: 14px;
    }

    /* === RWD === */
    @media (max-width: 767px) {
      .tsn-mat__filter-bar { flex-direction: column; align-items: stretch; }

      .tsn-mat__rank--cell { margin: -8px -10px; padding: 8px 10px; }
    }
  </style>

  <script>
  (function () {
    var root = document.currentScript.closest('.tsn-mat');
    if (!root) return;
    var dataEl = root.querySelector('#tsn-mat-data');
    var DATA;
    try { DATA = JSON.parse(dataEl.textContent); }
    catch (e) { console.error('[tsn-mat] JSON parse error', e); return; }

    // 區塊標題（雙語）
    var TITLES = {
      drinking_water: {
        zh: '飲用水認證材料 實驗結果',
        en: 'Drinking Water Approval Materials – Test Results'
      },
      standard_material: {
        zh: '標準材料對照表',
        en: 'Standard Material Tabulation'
      }
    };
    var RESET_LABEL = { zh: '清除篩選', en: 'Reset' };

    // 自動偵測語言：
    //   ① ?lang=zh / ?lang=en 查詢參數（給本機預覽用）
    //   ② URL 路徑含 /zh/ 或 -zh
    //   ③ <html lang="zh-XX"> 屬性
    //   都不符合就 fallback 為 en
    function detectLang() {
      try {
        var qLang = new URLSearchParams(location.search).get('lang');
        if (qLang) return qLang.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      } catch (e) { /* 舊瀏覽器沒有 URLSearchParams 就略過 */ }
      var path = (location.pathname || '').toLowerCase();
      if (/(^|\/)zh(\/|$|-)/.test(path) || path.indexOf('-zh') !== -1) return 'zh';
      var htmlLang = (document.documentElement.lang || '').toLowerCase();
      if (htmlLang.indexOf('zh') === 0) return 'zh';
      return 'en';
    }

    // 狀態（依本檔載入的資料有哪幾個 table 動態建立）
    var state = { lang: detectLang() };
    if (DATA.drinking_water) {
      state.drinking_water = {
        category:    new Set(),
        subcategory: new Set(),
        test_item:   new Set()
      };
    }
    if (DATA.standard_material) {
      state.standard_material = {
        polymer:  new Set(),
        type:     new Set(),
        property: new Set()
      };
      // 標準材料的「特性」篩選預設全選（控制顯示哪幾欄）
      DATA.standard_material.property_keys.forEach(function (k) {
        state.standard_material.property.add(k);
      });
    }

    function t(v) { return typeof v === 'string' ? v : v[state.lang]; }
    function L(obj, zh, en) { return state.lang === 'zh' ? zh : en; }

    // ========== 篩選器渲染 ==========
    function buildFilter(tableKey, filterKey, options, optionValueFn, optionLabelFn) {
      var wrap = document.createElement('div');
      wrap.className = 'tsn-mat__filter';
      wrap.dataset.filterKey = filterKey;

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tsn-mat__filter-btn';
      wrap.appendChild(btn);

      var panel = document.createElement('div');
      panel.className = 'tsn-mat__filter-panel';
      wrap.appendChild(panel);

      var actions = document.createElement('div');
      actions.className = 'tsn-mat__filter-actions';
      var btnAll = document.createElement('button');
      btnAll.type = 'button'; btnAll.className = 'tsn-mat__filter-action';
      btnAll.dataset.action = 'all';
      var btnClear = document.createElement('button');
      btnClear.type = 'button'; btnClear.className = 'tsn-mat__filter-action';
      btnClear.dataset.action = 'clear';
      actions.appendChild(btnAll);
      actions.appendChild(btnClear);
      panel.appendChild(actions);

      options.forEach(function (opt) {
        var val = optionValueFn(opt);
        var label = document.createElement('label');
        label.className = 'tsn-mat__filter-opt';
        var input = document.createElement('input');
        input.type = 'checkbox';
        input.value = val;
        input.dataset.optValue = val;
        var span = document.createElement('span');
        span.dataset.optLabel = '';
        span.textContent = optionLabelFn(opt);
        label.appendChild(input);
        label.appendChild(span);
        panel.appendChild(label);

        input.addEventListener('change', function (e) {
          var set = state[tableKey][filterKey];
          if (e.target.checked) set.add(val);
          else set.delete(val);
          updateFilterBtn(tableKey, filterKey);
          renderTable(tableKey);
        });
      });

      btnAll.addEventListener('click', function () {
        var set = state[tableKey][filterKey];
        panel.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.checked = true;
          set.add(cb.value);
        });
        updateFilterBtn(tableKey, filterKey);
        renderTable(tableKey);
      });
      btnClear.addEventListener('click', function () {
        var set = state[tableKey][filterKey];
        panel.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.checked = false;
        });
        set.clear();
        updateFilterBtn(tableKey, filterKey);
        renderTable(tableKey);
      });

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var isOpen = wrap.classList.contains('is-open');
        closeAllFilters();
        if (!isOpen) wrap.classList.add('is-open');
      });

      return wrap;
    }

    function closeAllFilters() {
      root.querySelectorAll('.tsn-mat__filter.is-open').forEach(function (el) {
        el.classList.remove('is-open');
      });
    }
    document.addEventListener('click', function (e) {
      if (!root.contains(e.target)) closeAllFilters();
      else if (!e.target.closest('.tsn-mat__filter')) closeAllFilters();
    });

    function updateFilterBtn(tableKey, filterKey) {
      var section = root.querySelector('[data-table="' + tableKey + '"]');
      var wrap = section.querySelector('.tsn-mat__filter[data-filter-key="' + filterKey + '"]');
      if (!wrap) return;
      var btn = wrap.querySelector('.tsn-mat__filter-btn');
      var labels = DATA[tableKey].filter_labels[state.lang];
      var labelText = labels[filterKey];
      var count = state[tableKey][filterKey].size;
      btn.textContent = '';
      btn.appendChild(document.createTextNode(labelText));
      if (count > 0) {
        var badge = document.createElement('span');
        badge.className = 'tsn-mat__filter-count';
        badge.textContent = count;
        btn.appendChild(badge);
      }
    }

    function updateFilterPanelLangs(tableKey) {
      var section = root.querySelector('[data-table="' + tableKey + '"]');
      var d = DATA[tableKey];
      section.querySelectorAll('.tsn-mat__filter').forEach(function (wrap) {
        var fkey = wrap.dataset.filterKey;
        // 更新「全選 / 清除」文字
        wrap.querySelectorAll('.tsn-mat__filter-action').forEach(function (a) {
          if (a.dataset.action === 'all')   a.textContent = L(null, '全選', 'Select All');
          if (a.dataset.action === 'clear') a.textContent = L(null, '清除', 'Clear');
        });
        // 更新選項標籤
        var options = d.filters[fkey];
        var labels = wrap.querySelectorAll('.tsn-mat__filter-opt [data-opt-label]');
        labels.forEach(function (span, i) {
          var opt = options[i];
          if (!opt) return;
          if (fkey === 'property') {
            span.textContent = opt[state.lang];
          } else if (typeof opt === 'string') {
            span.textContent = opt;
          } else {
            span.textContent = opt[state.lang];
          }
        });
        updateFilterBtn(tableKey, fkey);
      });
    }

    // ========== 表格渲染 ==========
    function passesFilter(set, value) {
      // 空集合 = 不篩選（顯示全部）
      return set.size === 0 || set.has(value);
    }

    function renderDrinkingWater() {
      var d = DATA.drinking_water;
      var section = root.querySelector('[data-table="drinking_water"]');
      if (!d || !section) return;
      var thead = section.querySelector('thead');
      var tbody = section.querySelector('tbody');

      // 表頭
      thead.innerHTML = '';
      var trh = document.createElement('tr');
      d.headers[state.lang].forEach(function (h) {
        var th = document.createElement('th');
        th.textContent = h;
        trh.appendChild(th);
      });
      thead.appendChild(trh);

      // 內容（套用篩選）
      var f = state.drinking_water;
      var rows = d.rows.filter(function (r) {
        return passesFilter(f.category,    r.category.zh)
            && passesFilter(f.subcategory, r.subcategory.zh)
            && passesFilter(f.test_item,   r.test_item.zh);
      });

      tbody.innerHTML = '';
      if (rows.length === 0) {
        var trEmpty = document.createElement('tr');
        var tdEmpty = document.createElement('td');
        tdEmpty.colSpan = d.headers[state.lang].length;
        tdEmpty.className = 'tsn-mat__empty';
        tdEmpty.textContent = L(null, '沒有符合條件的資料', 'No matching data');
        trEmpty.appendChild(tdEmpty);
        tbody.appendChild(trEmpty);
        return;
      }
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        [
          t(r.category), t(r.subcategory), t(r.test_item),
          r.method, r.unit, t(r.condition),
          r.epdm_60, r.epdm_70
        ].forEach(function (val, idx) {
          var td = document.createElement('td');
          td.textContent = val || '';
          if (idx === 6 || idx === 7) td.className = 'is-numeric tsn-mat__td--value';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function renderStandardMaterial() {
      var d = DATA.standard_material;
      var section = root.querySelector('[data-table="standard_material"]');
      if (!d || !section) return;
      var thead = section.querySelector('thead');
      var tbody = section.querySelector('tbody');
      var legendEl = section.querySelector('[data-legend]');

      var f = state.standard_material;
      // 要顯示哪幾個特性欄（property 篩選器控制）
      var activeProps = d.property_keys.filter(function (k) {
        return passesFilter(f.property, k);
      });

      // 表頭：固定 4 欄 + 動態特性欄
      thead.innerHTML = '';
      var trh = document.createElement('tr');
      d.headers[state.lang].forEach(function (h) {
        var th = document.createElement('th');
        th.textContent = h;
        trh.appendChild(th);
      });
      activeProps.forEach(function (slug) {
        var th = document.createElement('th');

℃ × 1008 hrs","en":"125℃ × 1008 hrs"},"epdm_60":"+10.9","epdm_70":"+10.2"},{"category":{"zh":"基本性質","en":"Physical Properties"},"subcategory":{"zh":"熱老化","en":"Heat Resistance"},"test_item":{"zh":"硬度變化","en":"Hardness Change"},"method":"ISO 188","unit":"Points","condition":{"zh":"150℃ × 70 hrs","en":"150℃ × 70 hrs"},"epdm_60":"+3.7","epdm_70":"-0.9"},{"category":{"zh":"基本性質","en":"Physical Properties"},"subcategory":{"zh":"熱老化","en":"Heat Resistance"},"test_item":{"zh":"硬度變化","en":"Hardness Change"},"method":"ISO 188","unit":"Points","condition":{"zh":"150℃ × 168 hrs","en":"150℃ × 168 hrs"},"epdm_60":"+6.6","epdm_70":"+4.9"},{"category":{"zh":"基本性質","en":"Physical Properties"},"subcategory":{"zh":"耐低溫","en":"Low-temp Resistance"},"test_item":{"zh":"低溫脆化","en":"Brittleness"},"method":"ISO 812","unit":"","condition":{"zh":"-70℃ × 3 mins","en":"-70℃ × 3 mins"},"epdm_60":"PASS","epdm_70":"PASS"},{"category":{"zh":"基本性質","en":"Physical Properties"},"subcategory":{"zh":"耐低溫","en":"Low-temp Resistance"},"test_item":{"zh":"TR-10","en":"TR-10"},"method":"ISO 2921","unit":"℃","condition":{"zh":"","en":""},"epdm_60":"-49.1","epdm_70":"-49.2"},{"category":{"zh":"耐化性","en":"Chemical Resistance"},"subcategory":{"zh":"耐臭氧","en":"Ozone Resistance"},"test_item":{"zh":"耐臭氧","en":"Ozone Resistance"},"method":"ISO 1431/1","unit":"","condition":{"zh":"40℃ × 70 hrs、200pphm / Eb 20%","en":"40℃ × 70 hrs、200pphm / Eb 20%"},"epdm_60":"PASS","epdm_70":"PASS"},{"category":{"zh":"耐化性","en":"Chemical Resistance"},"subcategory":{"zh":"耐冷卻液","en":"Coolant Resistance"},"test_item":{"zh":"硬度變化","en":"Hardness Change"},"method":"ISO 1817","unit":"Points","condition":{"zh":"120℃ × 70 hrs","en":"120℃ × 70 hrs"},"epdm_60":"-1.1","epdm_70":"-3.7"},{"category":{"zh":"耐化性","en":"Chemical Resistance"},"subcategory":{"zh":"耐甲醇","en":"Methanol Resistance"},"test_item":{"zh":"硬度變化","en":"Hardness Change"},"method":"ISO 1817","unit":"Points","condition":{"zh":"23℃ × 70 hrs","en":"23℃ × 70 hrs"},"epdm_60":"-2.3","epdm_70":"-2.2"},{"category":{"zh":"耐化性","en":"Chemical Resistance"},"subcategory":{"zh":"耐甲醇烘乾後","en":"Methanol Resistance-After Drying"},"test_item":{"zh":"硬度變化","en":"Hardness Change"},"method":"ISO 1817","unit":"Points","condition":{"zh":"100℃ × 24 hrs","en":"100℃ × 24 hrs"},"epdm_60":"+3.9","epdm_70":"-2.7"},{"category":{"zh":"耐化性","en":"Chemical Resistance"},"subcategory":{"zh":"耐丁酮","en":"Butanone Resistance"},"test_item":{"zh":"硬度變化","en":"Hardness Change"},"method":"ISO 1817","unit":"Points","condition":{"zh":"23℃ × 70 hrs","en":"23℃ × 70 hrs"},"epdm_60":"-7.6","epdm_70":"-8.4"},{"category":{"zh":"耐化性","en":"Chemical Resistance"},"subcategory":{"zh":"耐丁酮烘乾後","en":"Butanone Resistance-After Drying"},"test_item":{"zh":"硬度變化","en":"Hardness Change"},"method":"ISO 1817","unit":"Points","condition":{"zh":"100℃ × 24 hrs","en":"100℃ × 24 hrs"},"epdm_60":"+1.8","epdm_70":"-0.9"}]}}</script>

  <script>
  (function () {
    var root = document.currentScript.closest('.tsn-mat');
    if (!root) return;
    var dataEl = root.querySelector('#tsn-mat-data');
    var DATA;
    try { DATA = JSON.parse(dataEl.textContent); }
    catch (e) { console.error('[tsn-mat] JSON parse error', e); return; }

    // 區塊標題（雙語）
    var TITLES = {
      drinking_water: {
        zh: '飲用水認證材料 實驗結果',
        en: 'Drinking Water Approval Materials – Test Results'
      },
      standard_material: {
        zh: '標準材料對照表',
        en: 'Standard Material Tabulation'
      }
    };
    var RESET_LABEL = { zh: '清除篩選', en: 'Reset' };

    // 自動偵測語言：
    //   ① ?lang=zh / ?lang=en 查詢參數（給本機預覽用）
    //   ② URL 路徑含 /zh/ 或 -zh
    //   ③ <html lang="zh-XX"> 屬性
    //   都不符合就 fallback 為 en
    function detectLang() {
      try {
        var qLang = new URLSearchParams(location.search).get('lang');
        if (qLang) return qLang.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      } catch (e) { /* 舊瀏覽器沒有 URLSearchParams 就略過 */ }
      var path = (location.pathname || '').toLowerCase();
      if (/(^|\/)zh(\/|$|-)/.test(path) || path.indexOf('-zh') !== -1) return 'zh';
      var htmlLang = (document.documentElement.lang || '').toLowerCase();
      if (htmlLang.indexOf('zh') === 0) return 'zh';
      return 'en';
    }

    // 狀態（依本檔載入的資料有哪幾個 table 動態建立）
    var state = { lang: detectLang() };
    if (DATA.drinking_water) {
      state.drinking_water = {
        category:    new Set(),
        subcategory: new Set(),
        test_item:   new Set()
      };
    }
    if (DATA.standard_material) {
      state.standard_material = {
        polymer:  new Set(),
        type:     new Set(),
        property: new Set()
      };
      // 標準材料的「特性」篩選預設全選（控制顯示哪幾欄）
      DATA.standard_material.property_keys.forEach(function (k) {
        state.standard_material.property.add(k);
      });
    }

    function t(v) { return typeof v === 'string' ? v : v[state.lang]; }
    function L(obj, zh, en) { return state.lang === 'zh' ? zh : en; }

    // ========== 篩選器渲染 ==========
    function buildFilter(tableKey, filterKey, options, optionValueFn, optionLabelFn) {
      var wrap = document.createElement('div');
      wrap.className = 'tsn-mat__filter';
      wrap.dataset.filterKey = filterKey;

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tsn-mat__filter-btn';
      wrap.appendChild(btn);

      var panel = document.createElement('div');
      panel.className = 'tsn-mat__filter-panel';
      wrap.appendChild(panel);

      var actions = document.createElement('div');
      actions.className = 'tsn-mat__filter-actions';
      var btnAll = document.createElement('button');
      btnAll.type = 'button'; btnAll.className = 'tsn-mat__filter-action';
      btnAll.dataset.action = 'all';
      var btnClear = document.createElement('button');
      btnClear.type = 'button'; btnClear.className = 'tsn-mat__filter-action';
      btnClear.dataset.action = 'clear';
      actions.appendChild(btnAll);
      actions.appendChild(btnClear);
      panel.appendChild(actions);

      options.forEach(function (opt) {
        var val = optionValueFn(opt);
        var label = document.createElement('label');
        label.className = 'tsn-mat__filter-opt';
        var input = document.createElement('input');
        input.type = 'checkbox';
        input.value = val;
        input.dataset.optValue = val;
        var span = document.createElement('span');
        span.dataset.optLabel = '';
        span.textContent = optionLabelFn(opt);
        label.appendChild(input);
        label.appendChild(span);
        panel.appendChild(label);

        input.addEventListener('change', function (e) {
          var set = state[tableKey][filterKey];
          if (e.target.checked) set.add(val);
          else set.delete(val);
          updateFilterBtn(tableKey, filterKey);
          renderTable(tableKey);
        });
      });

      btnAll.addEventListener('click', function () {
        var set = state[tableKey][filterKey];
        panel.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.checked = true;
          set.add(cb.value);
        });
        updateFilterBtn(tableKey, filterKey);
        renderTable(tableKey);
      });
      btnClear.addEventListener('click', function () {
        var set = state[tableKey][filterKey];
        panel.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.checked = false;
        });
        set.clear();
        updateFilterBtn(tableKey, filterKey);
        renderTable(tableKey);
      });

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var isOpen = wrap.classList.contains('is-open');
        closeAllFilters();
        if (!isOpen) wrap.classList.add('is-open');
      });

      return wrap;
    }

    function closeAllFilters() {
      root.querySelectorAll('.tsn-mat__filter.is-open').forEach(function (el) {
        el.classList.remove('is-open');
      });
    }
    document.addEventListener('click', function (e) {
      if (!root.contains(e.target)) closeAllFilters();
      else if (!e.target.closest('.tsn-mat__filter')) closeAllFilters();
    });

    function updateFilterBtn(tableKey, filterKey) {
      var section = root.querySelector('[data-table="' + tableKey + '"]');
      var wrap = section.querySelector('.tsn-mat__filter[data-filter-key="' + filterKey + '"]');
      if (!wrap) return;
      var btn = wrap.querySelector('.tsn-mat__filter-btn');
      var labels = DATA[tableKey].filter_labels[state.lang];
      var labelText = labels[filterKey];
      var count = state[tableKey][filterKey].size;
      btn.textContent = '';
      btn.appendChild(document.createTextNode(labelText));
      if (count > 0) {
        var badge = document.createElement('span');
        badge.className = 'tsn-mat__filter-count';
        badge.textContent = count;
        btn.appendChild(badge);
      }
    }

    function updateFilterPanelLangs(tableKey) {
      var section = root.querySelector('[data-table="' + tableKey + '"]');
      var d = DATA[tableKey];
      section.querySelectorAll('.tsn-mat__filter').forEach(function (wrap) {
        var fkey = wrap.dataset.filterKey;
        // 更新「全選 / 清除」文字
        wrap.querySelectorAll('.tsn-mat__filter-action').forEach(function (a) {
          if (a.dataset.action === 'all')   a.textContent = L(null, '全選', 'Select All');
          if (a.dataset.action === 'clear') a.textContent = L(null, '清除', 'Clear');
        });
        // 更新選項標籤
        var options = d.filters[fkey];
        var labels = wrap.querySelectorAll('.tsn-mat__filter-opt [data-opt-label]');
        labels.forEach(function (span, i) {
          var opt = options[i];
          if (!opt) return;
          if (fkey === 'property') {
            span.textContent = opt[state.lang];
          } else if (typeof opt === 'string') {
            span.textContent = opt;
          } else {
            span.textContent = opt[state.lang];
          }
        });
        updateFilterBtn(tableKey, fkey);
      });
    }

    // ========== 表格渲染 ==========
    function passesFilter(set, value) {
      // 空集合 = 不篩選（顯示全部）
      return set.size === 0 || set.has(value);
    }

    function renderDrinkingWater() {
      var d = DATA.drinking_water;
      var section = root.querySelector('[data-table="drinking_water"]');
      if (!d || !section) return;
      var thead = section.querySelector('thead');
      var tbody = section.querySelector('tbody');

      // 表頭
      thead.innerHTML = '';
      var trh = document.createElement('tr');
      d.headers[state.lang].forEach(function (h) {
        var th = document.createElement('th');
        th.textContent = h;
        trh.appendChild(th);
      });
      thead.appendChild(trh);

      // 內容（套用篩選）
      var f = state.drinking_water;
      var rows = d.rows.filter(function (r) {
        return passesFilter(f.category,    r.category.zh)
            && passesFilter(f.subcategory, r.subcategory.zh)
            && passesFilter(f.test_item,   r.test_item.zh);
      });

      tbody.innerHTML = '';
      if (rows.length === 0) {
        var trEmpty = document.createElement('tr');
        var tdEmpty = document.createElement('td');
        tdEmpty.colSpan = d.headers[state.lang].length;
        tdEmpty.className = 'tsn-mat__empty';
        tdEmpty.textContent = L(null, '沒有符合條件的資料', 'No matching data');
        trEmpty.appendChild(tdEmpty);
        tbody.appendChild(trEmpty);
        return;
      }
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        [
          t(r.category), t(r.subcategory), t(r.test_item),
          r.method, r.unit, t(r.condition),
          r.epdm_60, r.epdm_70
        ].forEach(function (val, idx) {
          var td = document.createElement('td');
          td.textContent = val || '';
          if (idx === 6 || idx === 7) td.className = 'is-numeric tsn-mat__td--value';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function renderStandardMaterial() {
      var d = DATA.standard_material;
      var section = root.querySelector('[data-table="standard_material"]');
      if (!d || !section) return;
      var thead = section.querySelector('thead');
      var tbody = section.querySelector('tbody');
      var legendEl = section.querySelector('[data-legend]');

      var f = state.standard_material;
      // 要顯示哪幾個特性欄（property 篩選器控制）
      var activeProps = d.property_keys.filter(function (k) {
        return passesFilter(f.property, k);
      });

      // 表頭：固定 4 欄 + 動態特性欄
      thead.innerHTML = '';
      var trh = document.createElement('tr');
      d.headers[state.lang].forEach(function (h) {
        var th = document.createElement('th');
        th.textContent = h;
        trh.appendChild(th);
      });
      activeProps.forEach(function (slug) {
        var th = document.createElement('th');
        th.textContent = d.property_labels[slug][state.lang];
        th.className = 'is-center';
        trh.appendChild(th);
      });
      thead.appendChild(trh);

      // 評級說明
      legendEl.innerHTML = '';
      ['A','B','C','D','E'].forEach(function (r) {
        var item = document.createElement('span');
        item.className = 'tsn-mat__legend-item';
        var pill = document.createElement('span');
        pill.className = 'tsn-mat__rank tsn-mat__rank--' + r;
        pill.textContent = r;
        var txt = document.createElement('span');
        txt.textContent = d.rating_legend[state.lang][r];
        item.appendChild(pill);
        item.appendChild(txt);
        legendEl.appendChild(item);
      });

      // 內容
      var rows = d.rows.filter(function (r) {
        return passesFilter(f.polymer, r.polymer)
            && passesFilter(f.type, r.type.zh);
      });

      tbody.innerHTML = '';
      if (rows.length === 0) {
        var trEmpty = document.createElement('tr');
        var tdEmpty = document.createElement('td');
        tdEmpty.colSpan = d.headers[state.lang].length + activeProps.length;
        tdEmpty.className = 'tsn-mat__empty';
        tdEmpty.textContent = L(null, '沒有符合條件的資料', 'No matching data');
        trEmpty.appendChild(tdEmpty);
        tbody.appendChild(trEmpty);
        return;
      }
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        var c1 = document.createElement('td'); c1.textContent = r.polymer; tr.appendChild(c1);
        var c2 = document.createElement('td'); c2.textContent = t(r.type); tr.appendChild(c2);
        var c3 = document.createElement('td'); c3.textContent = r.hardness; c3.className='is-center'; tr.appendChild(c3);
        var c4 = document.createElement('td'); c4.textContent = r.service_temp; c4.className='is-center'; tr.appendChild(c4);
        activeProps.forEach(function (slug) {
          var td = document.createElement('td');
          td.className = 'is-center';
          var rank = r.ratings[slug];
          if (rank) {
            var pill = document.createElement('span');
            // --cell 變體：用負 margin 撐滿整格，做 Excel 條件格式效果
            pill.className = 'tsn-mat__rank tsn-mat__rank--cell tsn-mat__rank--' + rank;
            pill.textContent = rank;
            td.appendChild(pill);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function renderTable(tableKey) {
      if (tableKey === 'drinking_water') renderDrinkingWater();
      else if (tableKey === 'standard_material') renderStandardMaterial();
    }

    function renderTitles() {
      root.querySelectorAll('[data-table]').forEach(function (sec) {
        var key = sec.dataset.table;
        var titleEl = sec.querySelector('[data-i18n-title]');
        if (titleEl) titleEl.textContent = TITLES[key][state.lang];
      });
    }

    function renderAll() {
      renderTitles();
      // 重置按鈕文字
      var resetBtn = root.querySelector('[data-i18n-reset]');
      if (resetBtn) resetBtn.textContent = RESET_LABEL[state.lang];
      if (DATA.drinking_water) {
        updateFilterPanelLangs('drinking_water');
        renderDrinkingWater();
      }
      if (DATA.standard_material) {
        updateFilterPanelLangs('standard_material');
        renderStandardMaterial();
      }
    }

    // 清除所有篩選（property 篩選器回復成「全選」即恢復為初始狀態）
    function resetFilters() {
      if (state.drinking_water) {
        state.drinking_water.category.clear();
        state.drinking_water.subcategory.clear();
        state.drinking_water.test_item.clear();
      }
      if (state.standard_material) {
        state.standard_material.polymer.clear();
        state.standard_material.type.clear();
        state.standard_material.property.clear();
        DATA.standard_material.property_keys.forEach(function (k) {
          state.standard_material.property.add(k);
        });
      }
      // 同步 UI：取消勾選；property 重新全勾
      root.querySelectorAll('.tsn-mat__filter').forEach(function (wrap) {
        var fkey = wrap.dataset.filterKey;
        wrap.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.checked = (fkey === 'property');
        });
      });
      renderAll();
      // 更新各篩選器按鈕的 badge 計數
      ['drinking_water', 'standard_material'].forEach(function (tk) {
        if (!state[tk]) return;
        Object.keys(state[tk]).forEach(function (fk) {
          updateFilterBtn(tk, fk);
        });
      });
    }

    // ========== 初始化 ==========
    // 飲用水：實驗性質 / 實驗分類 / 測試項目
    (function () {
      var d = DATA.drinking_water;
      if (!d) return;
      var container = root.querySelector('[data-table="drinking_water"] [data-filters]');
      if (!container) return;
      ['category', 'subcategory', 'test_item'].forEach(function (fkey) {
        var f = buildFilter('drinking_water', fkey, d.filters[fkey],
          function (opt) { return opt.zh; },
          function (opt) { return opt.zh; });
        container.appendChild(f);
      });
    })();

    // 標準材料：Polymer / Type / Property
    (function () {
      var d = DATA.standard_material;
      if (!d) return;
      var container = root.querySelector('[data-table="standard_material"] [data-filters]');
      if (!container) return;
      container.appendChild(buildFilter('standard_material', 'polymer', d.filters.polymer,
        function (opt) { return opt.zh; },
        function (opt) { return opt.zh; }));
      container.appendChild(buildFilter('standard_material', 'type', d.filters.type,
        function (opt) { return opt.zh; },
        function (opt) { return opt.zh; }));
      // Property（預設全選，所以要把 checkbox 設成 checked）
      var propFilter = buildFilter('standard_material', 'property', d.filters.property,
        function (opt) { return opt.slug; },
        function (opt) { return opt.zh; });
      propFilter.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
        cb.checked = true;
      });
      container.appendChild(propFilter);
    })();

    // 重置按鈕
    var resetBtn = root.querySelector('.tsn-mat__reset');
    if (resetBtn) resetBtn.addEventListener('click', resetFilters);

    renderAll();
  })();
